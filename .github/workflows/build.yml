name: Build CLZip Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller CLZip.spec

      - name: Compilar instalador con Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_setup.iss

      - name: Guardar instalador como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: CLZip_Installer
          path: dist_installer/*.exe
